<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务管家 · 账户</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div class="app app--gray app--tabbed">
  <div class="topbar">
    <span class="topbar__title">账户</span>
    <span class="topbar__action">+ 添加账户</span>
  </div>

  <div class="content">
    <!-- 总资产（深色卡片） -->
    <div class="dark-card">
      <span class="dark-card__label">总资产</span>
      <span class="dark-card__amount num">¥ 23,450.80</span>
      <span class="dark-card__meta">4 个账户</span>
    </div>

    <!-- 账户列表 -->
    <div class="list">
      <div class="list-item">
        <div class="list-item__left">
          <span class="icon-block icon-block--dark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v10H3"/><circle cx="12" cy="12" r="2.5"/></svg></span>
          <span class="list-item__title">现金</span>
        </div>
        <span class="list-item__amount num">¥ 1,250.00</span>
      </div>
      <div class="list-item">
        <div class="list-item__left">
          <span class="icon-block icon-block--dark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 9.5h18"/></svg></span>
          <span class="list-item__title">银行卡</span>
        </div>
        <span class="list-item__amount num">¥ 18,500.80</span>
      </div>
      <div class="list-item">
        <div class="list-item__left">
          <span class="icon-block icon-block--dark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14v9H10l-4 4V6"/></svg></span>
          <span class="list-item__title">微信支付</span>
        </div>
        <span class="list-item__amount num">¥ 2,300.00</span>
      </div>
      <div class="list-item">
        <div class="list-item__left">
          <span class="icon-block icon-block--dark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9 9h6M12 9v6"/></svg></span>
          <span class="list-item__title">支付宝</span>
        </div>
        <span class="list-item__amount num">¥ 1,400.00</span>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <div class="tabbar__pill">
      <a class="tab" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg>
        <span class="tab__label">首页</span>
      </a>
      <a class="tab" href="stats.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round"><path d="M5 20V13M12 20V5M19 20v-6"/></svg>
        <span class="tab__label">统计</span>
      </a>
      <a class="tab tab--active" href="accounts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M3.5 9.5h17"/></svg>
        <span class="tab__label">账户</span>
      </a>
      <a class="tab" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5.5 20c.5-3.5 3-5 6.5-5s6 1.5 6.5 5"/></svg>
        <span class="tab__label">我的</span>
      </a>
    </div>
    <span class="tabbar__home"></span>
  </nav>
</div>
</body>
</html>
