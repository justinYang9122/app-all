<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务管家 · 统计</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  /* 页面独有：分类占比图表 + 图例 */
  .chart{background:var(--white);border-radius:var(--radius-card);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-card)}
  .chart__title{font-size:15px;font-weight:600;color:var(--ink)}
  .chart__bar{display:flex;height:20px;border-radius:10px;overflow:hidden;background:var(--bg)}
  .chart__seg--red{flex:40;background:var(--red)}
  .chart__seg--black{flex:20;background:var(--ink)}
  .chart__seg--gray{flex:25;background:var(--chart-3)}
  .chart__seg--light{flex:15;background:var(--chart-4)}
  .legend{display:flex;flex-direction:column;gap:10px}
  .legend__row{display:flex;align-items:center;justify-content:space-between}
  .legend__left{display:flex;align-items:center;gap:8px}
  .legend__dot{width:8px;height:8px;border-radius:50%}
  .legend__name{font-size:13px;font-weight:600;color:var(--ink)}
  .legend__value{font-size:13px;color:var(--gray)}
</style>
</head>
<body>
<div class="app app--gray app--tabbed">
  <div class="topbar">
    <span class="topbar__title" style="display:flex;align-items:center;gap:4px">
      2026年8月
      <svg viewBox="0 0 12 12" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg>
    </span>
    <span class="topbar__action">导出</span>
  </div>

  <div class="content">
    <!-- 汇总（深色卡片） -->
    <div class="dark-card">
      <span class="dark-card__label">本月结余</span>
      <span class="dark-card__amount num">¥ 8,430.50</span>
      <div class="dark-card__divider"></div>
      <div class="dark-card__row">
        <div class="dark-card__col">
          <span class="dark-card__col-label">收入</span>
          <span class="dark-card__col-amount num">¥ 12,500</span>
        </div>
        <div class="dark-card__col dark-card__col--right">
          <span class="dark-card__col-label">支出</span>
          <span class="dark-card__col-amount dark-card__col-amount--expense num">-¥ 4,069.50</span>
        </div>
      </div>
    </div>

    <!-- 分类占比 -->
    <div class="chart">
      <span class="chart__title">分类占比</span>
      <div class="chart__bar">
        <span class="chart__seg--red"></span>
        <span class="chart__seg--black"></span>
        <span class="chart__seg--gray"></span>
        <span class="chart__seg--light"></span>
      </div>
      <div class="legend">
        <div class="legend__row">
          <span class="legend__left"><span class="legend__dot" style="background:#E63329"></span><span class="legend__name">餐饮</span></span>
          <span class="legend__value num">¥ 1,628.00 · 40%</span>
        </div>
        <div class="legend__row">
          <span class="legend__left"><span class="legend__dot" style="background:#111111"></span><span class="legend__name">交通</span></span>
          <span class="legend__value num">¥ 814.00 · 20%</span>
        </div>
        <div class="legend__row">
          <span class="legend__left"><span class="legend__dot" style="background:#555555"></span><span class="legend__name">购物</span></span>
          <span class="legend__value num">¥ 1,017.00 · 25%</span>
        </div>
        <div class="legend__row">
          <span class="legend__left"><span class="legend__dot" style="background:#C9C9CE"></span><span class="legend__name">其他</span></span>
          <span class="legend__value num">¥ 610.50 · 15%</span>
        </div>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <div class="tabbar__pill">
      <a class="tab" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg>
        <span class="tab__label">首页</span>
      </a>
      <a class="tab tab--active" href="stats.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M5 20V13M12 20V5M19 20v-6"/></svg>
        <span class="tab__label">统计</span>
      </a>
      <a class="tab" href="accounts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M3.5 9.5h17"/></svg>
        <span class="tab__label">账户</span>
      </a>
      <a class="tab" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5.5 20c.5-3.5 3-5 6.5-5s6 1.5 6.5 5"/></svg>
        <span class="tab__label">我的</span>
      </a>
    </div>
    <span class="tabbar__home"></span>
  </nav>
</div>
</body>
</html>
