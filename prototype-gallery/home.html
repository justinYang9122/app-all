<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务管家 · 首页</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  /* 页面独有：问候行 + 日期分组标签 */
  .greeting{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px}
  .greeting__text{font-size:18px;font-weight:600;color:var(--ink)}
  .list__date{font-size:12px;color:var(--gray);padding:0 16px}
  .list__group{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="app app--gray app--tabbed">
  <!-- 问候 -->
  <div class="greeting">
    <span class="greeting__text">早上好，栗子</span>
    <span class="avatar">栗</span>
  </div>

  <!-- 月度概览（深色卡片） -->
  <div class="dark-card" style="margin:14px 16px 0">
    <div class="dark-card__row">
      <span class="dark-card__label">本月结余</span>
      <span class="topbar__action" style="display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600">
        2026.08
        <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5l3 3 3-3"/></svg>
      </span>
    </div>
    <div class="dark-card__amount num">¥ 8,430.50</div>
    <div class="dark-card__divider"></div>
    <div class="dark-card__row">
      <div class="dark-card__col">
        <span class="dark-card__col-label">收入</span>
        <span class="dark-card__col-amount num">¥ 12,500.00</span>
      </div>
      <div class="dark-card__col dark-card__col--right">
        <span class="dark-card__col-label">支出</span>
        <span class="dark-card__col-amount dark-card__col-amount--expense num">-¥ 4,069.50</span>
      </div>
    </div>
  </div>

  <!-- 明细列表 -->
  <div class="section-head">
    <span class="section-head__title">本月明细</span>
    <span class="section-head__more">全部
      <svg viewBox="0 0 12 12" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3l3 3-3 3"/></svg>
    </span>
  </div>

  <div class="list" style="padding:0 16px">
    <div class="list__group">
      <span class="list__date">今天 · 8月19日</span>
      <div class="list-item list-item--tall">
        <div class="list-item__left">
          <span class="icon-block"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="14" r="6"/><path d="M9 14V9M12 14V7M15 14V9"/></svg></span>
          <span class="list-item__text"><span class="list-item__title">餐饮</span><span class="list-item__sub">午餐 · 星巴克</span></span>
        </div>
        <span class="list-item__amount list-item__amount--expense num">-¥ 38.00</span>
      </div>
      <div class="list-item list-item--tall">
        <div class="list-item__left">
          <span class="icon-block"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5l1.3-4.2A2 2 0 0 1 8.2 10h7.6a2 2 0 0 1 1.9 1.3L19 15.5"/><rect x="4" y="15.5" width="16" height="3.2" rx="1.2"/><path d="M7.5 19.5v1M16.5 19.5v1"/></svg></span>
          <span class="list-item__text"><span class="list-item__title">交通</span><span class="list-item__sub">地铁卡充值</span></span>
        </div>
        <span class="list-item__amount list-item__amount--expense num">-¥ 12.50</span>
      </div>
    </div>

    <div class="list__group">
      <span class="list__date">昨天 · 8月18日</span>
      <div class="list-item list-item--tall">
        <div class="list-item__left">
          <span class="icon-block"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6.5 9.5h.01M17.5 14.5h.01"/></svg></span>
          <span class="list-item__text"><span class="list-item__title">工资</span><span class="list-item__sub">八月工资</span></span>
        </div>
        <span class="list-item__amount num">+¥ 12,500.00</span>
      </div>
      <div class="list-item list-item--tall">
        <div class="list-item__left">
          <span class="icon-block"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg></span>
          <span class="list-item__text"><span class="list-item__title">购物</span><span class="list-item__sub">家居用品</span></span>
        </div>
        <span class="list-item__amount list-item__amount--expense num">-¥ 259.00</span>
      </div>
    </div>
  </div>

  <!-- 记一笔 -->
  <a class="fab" href="record.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </a>

  <!-- TabBar -->
  <nav class="tabbar">
    <div class="tabbar__pill">
      <a class="tab tab--active" href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg>
        <span class="tab__label">首页</span>
      </a>
      <a class="tab" href="stats.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round"><path d="M5 20V13M12 20V5M19 20v-6"/></svg>
        <span class="tab__label">统计</span>
      </a>
      <a class="tab" href="accounts.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M3.5 9.5h17"/></svg>
        <span class="tab__label">账户</span>
      </a>
      <a class="tab" href="profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A8A8E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5.5 20c.5-3.5 3-5 6.5-5s6 1.5 6.5 5"/></svg>
        <span class="tab__label">我的</span>
      </a>
    </div>
    <span class="tabbar__home"></span>
  </nav>
</div>
</body>
</html>
