<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务管家 · 记一笔</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  /* 页面独有：金额输入 + 分类网格 + 附加信息行 */
  .content{gap:24px}
  .amount{display:flex;align-items:center;justify-content:center;gap:8px;height:64px}
  .amount__yen{font-size:28px;color:var(--gray);font-weight:500}
  .amount__val{font-size:48px;font-weight:700;color:var(--ink)}
  .amount__cursor{width:2px;height:40px;background:var(--red)}
  .grid{display:flex;flex-wrap:wrap}
  .cell{width:20%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;cursor:pointer}
  .cell__icon{width:48px;height:48px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center}
  .cell__icon svg{width:24px;height:24px}
  .cell__label{font-size:11px;color:var(--gray)}
  .cell--active .cell__icon{background:var(--red)}
  .cell--active .cell__icon svg{stroke:#fff}
  .cell--active .cell__label{color:var(--ink);font-weight:600}
  .meta-dot{width:6px;height:6px;border-radius:50%;background:var(--ink);flex-shrink:0}
  .meta-label{font-size:14px;font-weight:600;color:var(--ink)}
  .meta-value{flex:1;text-align:right;font-size:13px;color:var(--gray)}
</style>
</head>
<body>
<div class="app app--white">
  <!-- 导航 -->
  <div class="topbar">
    <a class="topbar__side" href="home.html">取消</a>
    <span class="topbar__title">记一笔</span>
    <span class="topbar__action">保存</span>
  </div>

  <div class="content">
    <!-- 收支切换 -->
    <div class="toggle">
      <span class="toggle__seg toggle__seg--active">支出</span>
      <span class="toggle__seg">收入</span>
    </div>

    <!-- 金额 -->
    <div class="amount">
      <span class="amount__yen">¥</span>
      <span class="amount__val num">0.00</span>
      <span class="amount__cursor"></span>
    </div>

    <!-- 分类网格（支出 10 类） -->
    <div class="grid">
      <div class="cell cell--active">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="14" r="6"/><path d="M9 14V9M12 14V7M15 14V9"/></svg></span>
        <span class="cell__label">餐饮</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15.5l1.3-4.2A2 2 0 0 1 8.2 10h7.6a2 2 0 0 1 1.9 1.3L19 15.5"/><rect x="4" y="15.5" width="16" height="3.2" rx="1.2"/><path d="M7.5 19.5v1M16.5 19.5v1"/></svg></span>
        <span class="cell__label">交通</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg></span>
        <span class="cell__label">购物</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z" fill="#111" stroke="none"/></svg></span>
        <span class="cell__label">娱乐</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg></span>
        <span class="cell__label">住房</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
        <span class="cell__label">医疗</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="3" width="9" height="18" rx="2"/><path d="M10.5 18h3"/></svg></span>
        <span class="cell__label">通讯</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9a2.2 2.2 0 1 0-2.2-2.2"/><path d="M5 20l7-8.5 7 8.5"/></svg></span>
        <span class="cell__label">服饰</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M12 9v11M4 13.5h16"/><path d="M12 9s-3.5-3-5-1.8c-.8.6-.2 1.8 5 1.8z"/><path d="M12 9s3.5-3 5-1.8c.8.6.2 1.8-5 1.8z"/></svg></span>
        <span class="cell__label">人情</span>
      </div>
      <div class="cell">
        <span class="cell__icon"><svg viewBox="0 0 24 24" fill="#111"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg></span>
        <span class="cell__label">其他</span>
      </div>
    </div>

    <!-- 附加信息 -->
    <div class="list">
      <div class="list-item">
        <div class="list-item__left">
          <span class="meta-dot"></span>
          <span class="meta-label">账户</span>
        </div>
        <span class="meta-value">现金</span>
        <svg class="list-item__chevron" viewBox="0 0 12 12" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3l3 3-3 3"/></svg>
      </div>
      <div class="list-item">
        <div class="list-item__left">
          <span class="meta-dot"></span>
          <span class="meta-label">备注</span>
        </div>
        <span class="meta-value">添加备注</span>
        <svg class="list-item__chevron" viewBox="0 0 12 12" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3l3 3-3 3"/></svg>
      </div>
      <div class="list-item">
        <div class="list-item__left">
          <span class="meta-dot"></span>
          <span class="meta-label">日期</span>
        </div>
        <span class="meta-value">今天 · 8月19日</span>
        <svg class="list-item__chevron" viewBox="0 0 12 12" fill="none" stroke="#8A8A8E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3l3 3-3 3"/></svg>
      </div>
    </div>

    <button class="btn" type="button">保存到账本</button>
  </div>
</div>
</body>
</html>
